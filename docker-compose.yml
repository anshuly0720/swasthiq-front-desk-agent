# One command to run the whole thing:  docker compose up --build
#
# Backend on http://localhost:8000, frontend on http://localhost:5173.
# Reads backend/.env for the model key; copy backend/.env.example first.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Keeps the conversation log across restarts so the handoff queue
      # survives a rebuild. Clinic state still resets per request.
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
